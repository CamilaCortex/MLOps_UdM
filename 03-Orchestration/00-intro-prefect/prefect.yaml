name: weather-flows

# Antes de desplegar, define la variable de entorno con la ruta absoluta de
# esta carpeta (00-intro-prefect). Ejemplo, ejecutado desde esta misma carpeta:
#   export PREFECT_PROJECT_DIR=$(pwd)
#
# Esto evita dejar una ruta personal fija en el repositorio: cada estudiante
# usa la ruta de su propia maquina.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ $PREFECT_PROJECT_DIR }}"

deployments:
  - name: simple-flow-deployment
    entrypoint: flows/02-weather1-flow.py:fetch_weather
    schedule:
      cron: "*/10 * * * *"
      timezone: "America/Bogota"
    parameters:
      lat: 6.2476
      lon: -75.5658

  - name: scheduled-flow
    entrypoint: flows/02-weather1-flow.py:fetch_weather
    schedule:
      cron: "0 */2 * * *"
      timezone: "America/Bogota"
    parameters:
      lat: 4.7110
      lon: -74.0721

